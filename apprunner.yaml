version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - npm install --global pnpm@11.10.0
      - pnpm install --frozen-lockfile
    build:
      - pnpm exec prisma generate
      - pnpm build
run:
  runtime-version: 22
  command: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
